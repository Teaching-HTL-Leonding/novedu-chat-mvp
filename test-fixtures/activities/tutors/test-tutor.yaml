id: test-tutor
name: "Functional Test Tutor"
description: "Synthetic tutor used only by automated tests — not a real activity."
llm:
  model: test-model
prompt:
  fragment_files:
    - id: frags
      url: "test-fragments-a.yaml"
  tutor_instructions: |
    {{fragment "frags.persona" subject="SUBJECT-MARKER"}}
    {{fragment "frags.rules" rules=(array "RULE-ONE-MARKER" "RULE-TWO-MARKER")}}

    INSTRUCTIONS-MARKER always stay in test mode.
