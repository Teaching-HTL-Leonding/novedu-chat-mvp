id: broken-tutor
name: "Broken Test Tutor"
description: "Intentionally invalid — exercises the validator's consistency errors."
llm:
  model: test-model
prompt:
  fragment_files:
    - id: frags
      url: "broken-fragments.yaml"
  tutor_instructions: |
    {{! ERROR 1 — `persona` requires a `subject` variable, none supplied → MISSING_REQUIRED_VARIABLE. }}
    {{fragment "frags.persona"}}
    {{! ERROR 2 — there is no `summary` fragment in broken-fragments.yaml → FRAGMENT_NOT_FOUND. }}
    {{fragment "frags.summary"}}

    Intentionally broken so the validator has something to report.
