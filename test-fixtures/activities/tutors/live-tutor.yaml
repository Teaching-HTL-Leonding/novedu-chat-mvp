id: live-test-tutor
name: "Live Test Tutor"
description: "Minimal tutor with a REAL model — drives the chat specs, which only
  send a message and assert a reply, so the content is irrelevant."
# A REAL model id: in real mode these specs send a message to the live SCCH
# endpoint (the fake LLM answers any id), unlike the hermetic fixtures which use a
# fake `test-model`.
llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
prompt:
  tutor_instructions: |
    You are a friendly tutor. Answer briefly.
