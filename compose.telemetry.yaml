# The standalone Aspire dashboard — the reference OTLP receiver for local
# development and diagnostic sessions (docs/telemetry.md, "Aspire local setup").
#
#   docker compose -f compose.telemetry.yaml up -d      # dashboard only (app on the host)
#   docker compose logs aspire | grep "login?t="         # the browser-token login URL
#   docker compose -f compose.telemetry.yaml down
#
# Defaults are kept on purpose: the UI needs the browser token from the container
# log (Frontend:AuthMode=BrowserToken) and the OTLP receiver is unsecured
# (Otlp:AuthMode=Unsecured) for trusted local senders. Never set
# ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS — it disables all dashboard
# authentication. Ports are published on loopback only.
# Telemetry lives in memory (10,000 logs / traces by default) and is gone on
# restart. Pinned to a full version, never `latest`.
services:
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    ports:
      - "127.0.0.1:18888:18888" # dashboard UI → http://localhost:18888
      - "127.0.0.1:4318:18890" # OTLP/HTTP for an app running on the host → http://localhost:4318
