# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/quizzes/quiz-yaml.schema.json
# Sample quiz definition — "Countries of the World".
#
# A quiz is authored in YAML, just like a tutor or a fragment library, and is
# served at a public URL (e.g. via the in-app YAML Files feature at
# /api/files/<name>). A teacher then mints a QUIZ CODE pointing at that URL and
# hands the /q/<code> link to students.
#
# Every question is OPEN-ENDED and graded by the LLM via its `evaluation`
# prompt — there are deliberately no multiple-choice questions. The model
# returns a structured verdict (correct | partial | incorrect) plus textual
# feedback, which the student sees immediately and which can seed an optional
# follow-up discussion chat about that question.

id: countries-basics
name: "Countries of the World — Basics"

# Student-facing welcome screen (both optional). `title` replaces the default
# greeting; `description` renders below it. Written FOR the student.
title: "World Geography Quiz"
description: |
  A short quiz on basic world geography — capitals, continents and a little
  map-reading. Answer in your own words; there are no multiple-choice options.
  You can stop at any time and see your summary.

# Privacy flag, FROZEN onto the quiz-code row when the code is minted (a later
# YAML edit does not change a live code). Default is `true` (anonymous): answers
# are still recorded for aggregate stats, but not linked to a student. Set
# `false` to attribute each attempt to the signed-in student (e.g. graded work).
anonymous: false

# Optional, default true. When true the questions are presented in a random
# order per attempt; set false to keep the authored order.
shuffle: true

# The model that grades answers AND drives the per-question discussion chat.
# Chosen by the teacher, same id space as a tutor's `llm.model`.
llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic

# Optional guidance for the follow-up discussion chat that a student can open on
# any question after seeing their feedback. Appended to a system prompt the app
# builds from the question, the expected answer, the student's answer and the
# verdict — so the assistant already has full context. Omit to use a sensible
# default.
discussion:
  instructions: |
    You are a friendly geography tutor helping the student understand THIS quiz
    question. Be encouraging and concise. You may reveal and explain the correct
    answer, since the student has already submitted theirs. Use small hints
    before full explanations, and relate facts to things the student likely
    already knows. Stay on the topic of this question.

# The questions. Order here is the authored order; `shuffle` controls what the
# student actually sees. Each question:
#   id          — stable identifier used for per-question stats (unique).
#   title       — optional short label for the stats table & progress display.
#   question    — MARKDOWN shown to the student (math via $…$ and code fences
#                 render exactly like an assistant chat message).
#   evaluation  — the grading prompt. SERVER-ONLY: it is never sent to the
#                 browser, so it may freely embed the expected answer and the
#                 criteria for each verdict.
questions:
  - id: capital-australia
    title: "Capital of Australia"
    question: |
      What is the **capital city of Australia**?

      _Hint: it is a common misconception that it is Sydney._
    evaluation: |
      The correct answer is **Canberra**.

      Grade as:
      - `correct`   — the student names Canberra (any reasonable spelling).
      - `incorrect` — the student names Sydney, Melbourne, or any other city.
      - `partial`   — the student is unsure but mentions Canberra among other
                      guesses, or describes it without naming it.

      In the feedback, confirm or gently correct, and note that Sydney and
      Melbourne are larger but not the capital.

  - id: continents-count
    title: "Number of continents"
    question: |
      How many **continents** are there on Earth, and can you name them?
    evaluation: |
      The widely taught answer is **seven** continents: Africa, Antarctica,
      Asia, Europe, North America, Oceania/Australia, and South America.

      Grade as:
      - `correct`   — seven, with all (or nearly all) named correctly.
      - `partial`   — seven but several continents missing or miscounted, OR a
                      defensible alternative model (e.g. a 6-continent model
                      merging Europe and Asia into Eurasia) explained sensibly.
      - `incorrect` — a clearly wrong count with no sound reasoning.

      Acknowledge that continent counts differ by convention if the student
      raises it.

  - id: longest-river
    title: "Longest river"
    question: |
      Which river is generally considered the **longest in the world**?

      Briefly explain why this is sometimes debated.
    evaluation: |
      Accept either the **Nile** (~6,650 km, the traditional answer) or the
      **Amazon** (~6,400–6,990 km depending on measurement). The debate stems
      from how a river's source and mouth are defined.

      Grade as:
      - `correct`   — names the Nile OR the Amazon AND gives a reasonable note
                      on why it is debated.
      - `partial`   — names a correct river but no explanation, or vice versa.
      - `incorrect` — names an unrelated river (e.g. Mississippi alone) with no
                      valid reasoning.

  - id: equator-latitude
    title: "Latitude of the equator"
    question: |
      The equator is the line of latitude that divides Earth into the Northern
      and Southern Hemispheres.

      What is its latitude, expressed as $\phi = ?$ degrees?
    evaluation: |
      The correct answer is $\phi = 0°$ (zero degrees latitude).

      Grade as:
      - `correct`   — 0 degrees (with or without the degree symbol/sign).
      - `partial`   — close confusion such as "0 longitude" or naming the prime
                      meridian instead, but clearly understanding "the middle".
      - `incorrect` — any non-zero value with no valid reasoning.

  - id: iso-country-codes
    title: "ISO country codes"
    question: |
      Many systems identify countries with **two-letter ISO 3166-1 alpha-2
      codes**, for example:

      ```
      DE → Germany
      FR → France
      JP → Japan
      ```

      Which countries do the codes `AT`, `BR` and `IN` stand for?
    evaluation: |
      The correct mapping is:
      - `AT` → Austria
      - `BR` → Brazil
      - `IN` → India

      Grade as:
      - `correct`   — all three correct.
      - `partial`   — one or two correct.
      - `incorrect` — none correct.

      In the feedback, give the full correct mapping.
