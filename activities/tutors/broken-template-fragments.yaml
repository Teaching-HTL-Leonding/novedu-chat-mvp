# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/tutors/tutor-yaml.schema.json
# An intentionally broken fragment LIBRARY: it passes schema validation, but one
# fragment's `content` template references a variable its `input_schema` never
# declares. Used by the validator tests to exercise FRAGMENT_TEMPLATE_ERROR —
# both standalone (`validate --kind fragment`) and via the thorough whole-library
# tutor check. Do NOT reference this from a real tutor.
id: broken-template-fragments
fragments:
  - id: persona
    version: 1
    priority: 100

    input_schema:
      type: object
      required:
        - subject
      properties:
        subject:
          type: string

    content: |
      You are a friendly tutor for {{subject}}.

  - id: motto
    version: 1
    priority: 200

    input_schema:
      type: object
      properties:
        rules:
          type: array
          items:
            type: string

    content: |
      Follow these rules:
      {{#each rules}}
      - {{this}}
      {{/each}}

      Remember the motto: {{undeclared_motto}}.
