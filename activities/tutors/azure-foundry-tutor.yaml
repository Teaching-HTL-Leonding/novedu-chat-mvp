# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/activities/tutors/tutor-yaml.schema.json
# A minimal tutor served by AZURE FOUNDRY instead of SCCH: `llm.provider` selects
# the provider, and `llm.model` is the Azure OpenAI DEPLOYMENT name.
id: azure-foundry-tutor
name: "Azure Foundry Tutor"
description: "A minimal, valid example tutor served from an Azure OpenAI deployment."
llm:
  model: gpt-5.4-mini
  provider: Azure Foundry
prompt:
  tutor_instructions: |
    You are a friendly, patient tutor for secondary-school students. Answer
    briefly, encourage the student to think for themselves, and never give a
    full solution immediately.
