# Novedu locally, outside Azure: the production image, a password-auth Postgres
# and the Aspire dashboard as OTLP receiver. Sign-in still goes through Entra ID
# and the LLM providers stay external — this is not an Azure-free app setup,
# only an Azure-free hosting of it (README "Running the whole stack with Docker
# Compose"; docs/telemetry.md; docs/database.md; docs/images.md).
#
#   docker compose up --build -d --wait   # build the image, start everything, wait for health
#   docker compose logs aspire | grep "login?t="
#   docker compose down                   # keep the data volumes
#   docker compose down -v                # wipe database + image files
#
# Values are interpolated from the developer's `.env` in this directory. Only
# the keys listed under `app.environment` reach the container — the `.env`'s
# Azure DATABASE_URL, IMAGE_STORAGE_ROOT, App Insights connection string and
# AZURE_FOUNDRY_ENDPOINT never do. Requires Docker Compose 2.20+ (`include`).
include:
  - compose.telemetry.yaml

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: "${NOVEDU_DB_PASSWORD:-Test-Passw0rd!}" # local only, never a real secret
      POSTGRES_DB: novedu
    volumes:
      # postgres:18 keeps its data in a subdirectory of this mount (not …/data).
      - novedu-db:/var/lib/postgresql
      # Runs once, when the volume is first created: the `mastra` schema the app
      # expects to pre-exist (app/mastra/index.ts).
      - ./scripts/db/local-init.sql:/docker-entrypoint-initdb.d/10-local-init.sql:ro
    ports:
      # Loopback only. Not 5432: that port is commonly taken by the plain
      # `docker run … postgres:18` container from docs/testing.md.
      - "127.0.0.1:${NOVEDU_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novedu"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Provisions the image storage root the app deliberately never creates
  # (lib/image-fs.ts): the sentinel file, the images/ directory, and ownership by
  # the image's non-root user (uid/gid 1001). The sentinel bytes are pinned to
  # lib/image-fs.ts by lib/image-fs.unit.test.ts. Runs to completion before the
  # app starts; idempotent on an existing volume.
  files-init:
    image: alpine:3.22
    volumes:
      - novedu-files:/novedu-files
    command:
      - sh
      - -c
      - >-
        mkdir -p /novedu-files/images &&
        printf 'novedu-files-v1\n' > /novedu-files/.novedu-files-root &&
        chown -R 1001:1001 /novedu-files

  app:
    build:
      context: .
      args:
        APP_VERSION: local
    image: novedu-chat:local
    depends_on:
      db:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully
      # Deliberately NOT aspire: app startup never waits for the receiver.
    ports:
      # Exactly localhost:3000 — the Entra redirect URI registered for local
      # development (README) and the origin better-auth infers when AUTH_URL is unset.
      - "127.0.0.1:3000:3000"
    volumes:
      - novedu-files:/novedu-files
    environment:
      # Local Postgres, password auth (no sslmode → plain TCP inside the Compose network).
      DATABASE_URL: "postgresql://postgres:${NOVEDU_DB_PASSWORD:-Test-Passw0rd!}@db:5432/novedu"
      IMAGE_STORAGE_ROOT: /novedu-files
      # Telemetry: standard OTLP to the dashboard on the Compose network. The
      # empty App Insights string makes it explicit that Azure Monitor never runs here.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18890
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-novedu-chat}"
      APPLICATIONINSIGHTS_CONNECTION_STRING: ""
      # Entra ID sign-in — required; boot fails without them (auth.ts). AUTH_URL
      # stays unset so better-auth infers http://localhost:3000 from the request.
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID:?set AZURE_TENANT_ID in .env}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID:?set AZURE_CLIENT_ID in .env}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET:?set AZURE_CLIENT_SECRET in .env}"
      TEACHER_GROUP_ID: "${TEACHER_GROUP_ID:?set TEACHER_GROUP_ID in .env}"
      # LLM providers — optional pass-through. Azure Foundry is not offered: its
      # passwordless Entra auth needs the Azure CLI or a managed identity, neither
      # of which exists inside this container (docs/ai-models.md).
      SCCH_BASE_URL: "${SCCH_BASE_URL:-}"
      SCCH_API_KEY: "${SCCH_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-}"
    healthcheck:
      # /api/version is the public, session-free liveness URL (proxy.ts).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/version').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s # first boot applies migrations and creates Mastra's tables

volumes:
  novedu-db:
  novedu-files:
