name: QA

# Full quality gate: biome check, typecheck, unit + component tests, production
# build, and the Playwright e2e suite (hermetic + DB-backed @live-db against an
# ephemeral SQL Server). Runs standalone on pull requests and as a reusable
# workflow (workflow_call) gating the Docker publish on main.
on:
  pull_request:
    branches: [main]
    # Doc-only and sample-spec changes don't affect the build or tests — skip the
    # gate when a PR touches nothing but Markdown, docs, or the authored activity
    # specs (a mixed PR still runs the full suite).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'coding/**'
      - 'quizzes/**'
      - 'tutors/**'
      - 'writings/**'
  workflow_call:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this gate only reads the code and runs tests — it never needs
# to write to the repo. (Fork PRs already get a read-only token and NO secrets;
# this also constrains the token on same-repo runs.)
permissions:
  contents: read

# SECURITY: this workflow must stay secret-free. It runs on fork pull_request,
# where untrusted PR code executes — anything in the environment here is
# exfiltratable. The values below are test-only DUMMIES (NOT secrets). Tests
# needing the SCCH LLM (geo-blocked to Austria, un-containerizable) are tagged
# @live-llm and excluded via `npm run test:e2e:ci`; they stay local-only. The
# DB-backed tests are tagged @live-db and DO run here, against the ephemeral SQL
# Server service in the e2e job (reached with SQL auth — its SA password is a
# non-secret DUMMY, so secret-freeness holds). Live credentials (real Azure SQL /
# SCCH) must NEVER be added here or run on a fork pull_request — only on a trusted
# trigger (push to main, a schedule, or a reviewer-gated environment). See
# docker-publish.yml for the secret-bearing main-only path.
#
# auth.ts requires the AZURE_* vars and TEACHER_GROUP_ID at module load (also
# during `next build`); AUTH_SECRET only needs to match between the e2e helpers
# and the dev server (e2e tests mint Auth.js session cookies directly, so no
# real Entra round-trip happens). Next's loadEnvConfig never overrides existing
# process.env, so no .env file is needed here.
env:
  AUTH_SECRET: ci-e2e-auth-secret
  AZURE_CLIENT_ID: ci-placeholder
  AZURE_CLIENT_SECRET: ci-placeholder
  AZURE_TENANT_ID: ci-placeholder
  TEACHER_GROUP_ID: ci-placeholder

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Component tests run in Vitest browser mode on Playwright Chromium.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run check

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npm run test:component

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Ephemeral SQL Server so the DB-backed @live-db tests run here via SQL auth (a
    # throwaway login, NOT Entra). The SA password is a non-secret DUMMY literal, so
    # this stays secret-free / fork-safe. The @live-llm tests are NOT run here (the
    # SCCH endpoint is geo-blocked + can't be containerized) — they stay local.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test-Passw0rd!"
        ports:
          - 1433:1433
    env:
      # SQL auth → the container. Encrypt=False (local self-signed cert); the
      # password is the dummy SA password above, NOT a secret.
      MSSQL_CONNECTION_STRING: "Server=tcp:localhost,1433;Initial Catalog=noveduTest;Encrypt=False;User ID=sa;Password=Test-Passw0rd!;Connection Timeout=30;"
      MSSQL_SQLAUTH_CONNECTION_STRING: "Server=tcp:localhost,1433;Initial Catalog=noveduTest;Encrypt=False;User ID=sa;Password=Test-Passw0rd!;Connection Timeout=30;"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The service container is up but SQL takes ~20-40s to accept connections;
      # wait, then create the app's database (the app migrates tables on boot via
      # instrumentation.ts but never creates the database itself).
      - name: Wait for SQL Server + create database
        run: node scripts/ci/wait-and-create-db.mjs

      # Runs hermetic + @live-db (against the container), excludes @live-llm.
      # Playwright's webServer boots `npm run dev`, which migrates novedu_* on start.
      - run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Production Docker build (NO push) — reproduces the multi-stage image build
  # exactly as docker-publish.yml does it, so a build break surfaces on the PR
  # instead of only after merge during CD. The plain `npm run build` step in the
  # `qa` job runs with ALL deps installed and so cannot catch breakage that only
  # appears in the layered image (e.g. the deps stage copies just the root
  # package.json, so a workspace's deps aren't installed when `next build`
  # runs) — only an actual Docker build does.
  #
  # Secret-free, same as the rest of this workflow: the Dockerfile bakes
  # build-only placeholder env, and we never log in or push. PR-only — on a main
  # push (workflow_call) the real build+push in docker-publish.yml is the gate,
  # so building here too would just be a redundant ~4-minute rebuild.
  prod-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Read the layer cache the main publish populates; don't write it
          # (cache export is restricted for fork pull_request tokens).
          cache-from: type=gha
