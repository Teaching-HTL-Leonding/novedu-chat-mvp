name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: rstropek/novedu-chat-mvp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Image version = package.json version + "." + an ever-increasing build
      # number (the workflow run number, which also increments on manual runs).
      - name: Derive image version
        id: version
        run: echo "version=$(jq -r .version package.json).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # QEMU + Buildx enable the multi-platform (amd64 + arm64) build below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
