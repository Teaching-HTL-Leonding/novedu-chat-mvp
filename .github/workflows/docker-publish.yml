name: Build and publish Docker image

on:
  push:
    branches: [main]
    # A doc-only, sample-spec or dev-tooling (agent skills, worktree config)
    # push doesn't change the image — skip the build/publish/deploy entirely.
    # Mixed pushes (code + docs) still publish.
    # EXCEPTION: teacher-docs/** is re-included (last matching pattern wins).
    # The image no longer contains the guide, but its version is the release
    # unit: promote.yml builds the guide from the promoted image's commit, so a
    # corpus change needs an image of its own to ever reach docs.novedu.at.
    # Manual runs (workflow_dispatch) always build regardless of what changed.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!activities/**'
      - '!.agents/**'
      - '!.claude'
      - '!.worktreeinclude'
      - 'teacher-docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/htl-leo-novedu/novedu-app

# Least privilege: every job gets a read-only token unless it asks for more.
# Only `build-and-push` may write packages (the GHCR push); only `deploy-dev`
# may request an OIDC token and read packages. The called qa.yml stays
# read-only.
permissions:
  contents: read

jobs:
  # Quality gate: nothing is built or published unless the full QA suite
  # (check, typecheck, unit + component tests, build, hermetic e2e) is green.
  qa:
    uses: ./.github/workflows/qa.yml

  # Builds the image ONCE and pushes it to GHCR (a public package of this
  # repo), the build artifact the `deploy-dev` job below copies into the Azure
  # registry. Production is the prod stage, reached only through the manual
  # promote.yml (docs/azure-runtime-env.md).
  build-and-push:
    needs: qa
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN pushes to GHCR — no stored registry credential.
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Image version = package.json version + "." + an ever-increasing build
      # number (the workflow run number, which also increments on manual runs).
      # built_at is baked into the image too so /api/version can report it.
      - name: Derive image version
        id: version
        run: |
          echo "version=$(jq -r .version package.json).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: Azure Container Apps runs amd64, and building the arm64
          # variant under QEMU emulation takes far too long. Build arm64
          # locally on a Mac if ever needed (the Dockerfile is multi-arch).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # Baked into the image (Dockerfile ARG -> ENV) so the running container
          # can report its identity via /api/version and /health (lib/version.ts).
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.version.outputs.built_at }}
          # Links the GHCR package to this repo (its page shows the README).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every publish deploys to the dev stage (docs/azure-runtime-env.md).
  # Promotion to the prod stage is the manual promote.yml.
  #
  # SECURITY: no secrets here. Azure trusts this job by OIDC federation — the
  # dev identity accepts a token only for this repo's `refs/heads/main`, so a
  # run from any other ref (or a fork) cannot log in (docs/ci-security.md).
  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      VERSION: ${{ needs.build-and-push.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEV_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reads the image with the built-in token, so the copy works whatever the
      # package's visibility (a new GHCR package starts out private).
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-to-registry copy of the image built above: same digest, so both
      # stages run exactly what was built and tested. Only the immutable version tag
      # goes to the registry, never :latest. The stages pull from the Azure
      # registry, not from GHCR, so a container start never depends on GHCR; the
      # copy can go once the app moves to on-prem hosting.
      - name: Copy the image to the Azure registry
        run: |
          az acr login --name crnovedu
          docker buildx imagetools create \
            --tag "crnovedu.azurecr.io/novedu:$VERSION" \
            "$IMAGE_NAME:$VERSION"

      - name: Deploy to dev
        uses: ./.github/actions/deploy-stage
        with:
          stage: dev
          version: ${{ env.VERSION }}
          base-url: ${{ vars.DEV_BASE_URL }}
