name: Build and publish Docker image

on:
  push:
    branches: [main]
    # A doc-only push doesn't change the image — skip the build/publish/deploy
    # entirely. Mixed pushes (code + docs) still publish. Manual runs
    # (workflow_dispatch) always build regardless of what changed.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: rstropek/novedu-chat-mvp

jobs:
  # Quality gate: nothing is built or published unless the full QA suite
  # (check, typecheck, unit + component tests, build, hermetic e2e) is green.
  qa:
    uses: ./.github/workflows/qa.yml

  build-and-push:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Image version = package.json version + "." + an ever-increasing build
      # number (the workflow run number, which also increments on manual runs).
      # built_at is baked into the image too so /api/version can report it.
      - name: Derive image version
        id: version
        run: |
          echo "version=$(jq -r .version package.json).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only: Azure App Service runs amd64, and building the arm64
          # variant under QEMU emulation takes far too long. Build arm64
          # locally on a Mac if ever needed (the Dockerfile is multi-arch).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # Baked into the image (Dockerfile ARG -> ENV) so the running container
          # can report its identity via /api/version and /health (lib/version.ts).
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.version.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell the Azure web app to pull the fresh :latest image (the secret is
      # the App Service container CI/CD webhook URL, which embeds credentials).
      - name: Trigger Azure App Service deployment
        # Passed via env, not inline: the URL's basic-auth username starts
        # with `$` and would be mangled by shell expansion in the run line.
        env:
          CI_CD_URL: ${{ secrets.AZURE_WEBAPP_CI_CD_URL }}
        run: curl -fsS -X POST "$CI_CD_URL"

      # Keep the Docker Hub repository description in sync with the README.
      # Non-blocking: editing the description needs a Docker Hub PAT with
      # Read/Write/Delete scope; the current DOCKER_PASSWORD can push images
      # but gets "Forbidden" here.
      - name: Update Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
