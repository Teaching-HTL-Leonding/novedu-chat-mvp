      Grade the student's answer:
      - `correct`   — names the present simple AND gives a reason meaning "fixed schedule/timetable".
      - `partial`   — right form but the reason is missing, vague or wrong; OR the right reason but a wrong/missing form label.
      - `incorrect` — a wrong form with no valid reasoning.

