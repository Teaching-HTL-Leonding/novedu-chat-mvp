# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/quizzes/quiz-yaml.schema.json
# Future Tenses self-assessment — converted from the "Future Tenses Tutor".
#
# The original tutor walked a student through 13 sentences, asking for the
# future-tense FORM and WHY. That maps directly onto a quiz: one open-ended
# question per sentence, graded by the LLM against the answer key embedded in
# each question's `evaluation` prompt.
#
# IMPORTANT: the grader only ever sees ONE question's `evaluation` at a time
# (never any global instructions), so the answer key, the accepted equivalent
# form labels, and the grading rubric are repeated in every question.

id: english-future-tenses
name: "Future Tenses — Self Assessment"
title: "Future Tenses – check what you know"
description: |
  A short self-assessment on the English **future tenses**. For each sentence,
  name the future-tense **form** (present simple, present progressive, going-to
  future, or will future) and explain **why** it is used.

  Answer in your own words — there are no multiple-choice options. You get instant
  feedback, and you can stop at any time to see your summary.

# Self-assessment, not graded work → anonymous (answers are not linked to a student).
anonymous: true

# Keep the authored order — the sentences build on each other like in the tutor.
shuffle: false

llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic

discussion:
  instructions: |
    You are a friendly, encouraging English teacher helping a German-speaking
    school student understand THIS future-tenses question. The conversation
    already contains the sentence, the student's answer, and the verdict with
    feedback — use that context.

    Reply in English by default; if the student writes in German or is clearly
    struggling, you may add a brief German explanation, then continue in English.
    Give small hints before full explanations, keep it concise and supportive,
    and keep the content appropriate for school students. Stay on this question.

questions:
  - id: q01-technology
    title: "Future technology"
    question: |
      Name the **future-tense form** in this sentence and explain **why** it is used:

      > "Technology will become even more advanced in the future."
    evaluation: |
      Correct answer:
      - Form: **will future**
      - Why: a prediction / assumption about the future.

      Accept these as the same form label: "will future", "future with will",
      "future simple (will)".

      Grade the student's answer:
      - `correct`   — names the will future AND gives a reason meaning "prediction/assumption" (any wording).
      - `partial`   — right form but the reason is missing, vague or wrong; OR the right reason but a wrong/missing form label.
      - `incorrect` — a wrong form with no valid reasoning.

      In the feedback, confirm or gently correct, state the form + reason, and stay short and encouraging.

  - id: q02-sue-fitness
    title: "Sue's fitness routine"
    question: |
      Name the **future-tense form** in this sentence and explain **why** it is used:

      > "Sue is going to start a new fitness routine next week."
    evaluation: |
      Correct answer:
      - Form: **going-to future**
      - Why: a plan / intention.

      Accept these as the same form label: "going-to future", "going to".

      Grade the student's answer:
      - `correct`   — names the going-to future AND gives a reason meaning "plan/intention".
      - `partial`   — right form but the reason is missing, vague or wrong; OR the right reason but a wrong/missing form label.
      - `incorrect` — a wrong form with no valid reasoning.

      In the feedback, confirm or gently correct, state the form + reason, and stay short and encouraging.

