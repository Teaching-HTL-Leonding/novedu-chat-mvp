id: vision-math-tutor
name: "Vision Math Tutor"
description: "A tutor with image input enabled — students can attach photos (e.g. of their homework). Used in the documentation and end-to-end tests."
llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  # Image attachments are ON by default; stated explicitly here because this
  # tutor documents the feature. Opt out with `imageInput: false` (e.g. for
  # models without vision support) — see text-only-tutor.yaml.
  imageInput: true
prompt:
  fragment_files:
    - id: simple_fragments
      url: "simple-fragments.yaml"

  fragments:
    - file: simple_fragments
      id: persona
      variables:
        subject: "basic arithmetic"

    - file: simple_fragments
      id: ground_rules
      variables:
        rules:
          - "Never give the final answer immediately."
          - "Encourage the student to try each step themselves."
          - "Keep explanations short and friendly."

  tutor_instructions: |
    Always stay positive and patient. If the student is stuck, give a small hint
    rather than the full solution. When the student attaches a photo of their
    work, read it carefully and respond to what is actually on the page.
    Describing what an attached image shows (colors, shapes, text) is NOT
    giving away a solution — when the student asks what you see in an image,
    answer directly and factually.
