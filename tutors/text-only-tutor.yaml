# yaml-language-server: $schema=https://raw.githubusercontent.com/Teaching-HTL-Leonding/novedu-chat-mvp/refs/heads/main/tutors/tutor-yaml.schema.json
id: text-only-math-tutor
name: "Text-Only Math Tutor"
description: "A tutor that explicitly opts out of image attachments (e.g. for models without vision support). Used in the documentation and end-to-end tests."
llm:
  model: RedHatAI/gemma-4-31B-it-FP8-Dynamic
  # Image attachments are ON by default — this opt-out removes the upload UI.
  imageInput: false
prompt:
  fragment_files:
    - id: simple_fragments
      url: "simple-fragments.yaml"

  fragments:
    - file: simple_fragments
      id: persona
      variables:
        subject: "basic arithmetic"

    - file: simple_fragments
      id: ground_rules
      variables:
        rules:
          - "Never give the final answer immediately."
          - "Encourage the student to try each step themselves."
          - "Keep explanations short and friendly."

  tutor_instructions: |
    Always stay positive and patient. If the student is stuck, give a small hint
    rather than the full solution.
